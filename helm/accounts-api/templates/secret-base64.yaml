{{- if .Values.postgres.connectionStringBase64 }}
# -----------------------------------------------------------------------------
# Variante en base64 de secret.yaml (usa "data" en vez de "stringData")
# -----------------------------------------------------------------------------
# "stringData" (ver secret.yaml) acepta texto plano: Kubernetes lo codifica a
# base64 automáticamente al persistir el Secret. "data", en cambio, espera que
# el valor YA venga codificado en base64 -- por eso se lee desde
# values-base64.yaml, donde postgres.connectionStringBase64 ya está pre-codificado.
#
# Uso: helm install ... -f values.yaml -f values-base64.yaml
#
# NOTA: genera el mismo Secret (mismo name/namespace) que secret.yaml, así que
# no renderices/apliques ambos templates a la vez dentro del mismo release.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "accounts-api.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "accounts-api.labels" . | nindent 4 }}
type: Opaque
data:
  ConnectionStrings__DefaultConnection: {{ .Values.postgres.connectionStringBase64 }}
{{- end }}
